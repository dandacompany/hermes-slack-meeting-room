# Merge these snippets into each Hermes profile config.yaml.

manager_profile:
  slack:
    dm_only: false
    require_mention: true
    strict_mention: true
    unauthorized_dm_behavior: "pair"
    allow_bots: "mentions"
    free_response_channels:
      - "<MEETING_CHANNEL_ID>"
    channel_prompts:
      "<MEETING_CHANNEL_ID>": |
        <PASTE_MANAGER_CHANNEL_PROMPT>
  platforms:
    slack:
      reply_in_thread: false
  voice:
    auto_tts: false
  tts:
    provider: edge

participant_profile:
  slack:
    dm_only: false
    require_mention: true
    strict_mention: true
    unauthorized_dm_behavior: "ignore"
    allow_bots: "mentions"
    free_response_channels:
      - "<MEETING_CHANNEL_ID>"
    channel_prompts:
      "<MEETING_CHANNEL_ID>": |
        <PASTE_PARTICIPANT_CHANNEL_PROMPT>
  platforms:
    slack:
      reply_in_thread: false
  voice:
    auto_tts: false
  tts:
    provider: edge

env_file_template: |
  SLACK_BOT_TOKEN=xoxb-...
  SLACK_APP_TOKEN=xapp-...
  SLACK_ALLOWED_USERS=<SLACK_USER_ID_1>,<SLACK_USER_ID_2>
  SLACK_HOME_CHANNEL=<OPTIONAL_HOME_CHANNEL_ID>
